<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lector PDF JabraScan</title>
  <!-- Bootstrap CSS 5.3.3 -->
  <link rel="stylesheet" href="./css/bootstrap.min.css" />
  <!-- CSS modular optimizado - solo lo necesario para el lector -->
  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/header.css" />
  <link rel="stylesheet" href="css/utilities.css" />
  <link rel="stylesheet" href="css/stylelector.css" />
  <!-- PDF.js -->
  <script type="module" src="./js/storage.js"></script>
  <!--<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>-->
  <script src="./js/pdf.min.js"></script>
  <script>
    // Configurar worker de PDF.js
    window.addEventListener('DOMContentLoaded', function() {
      if (window.pdfjsLib && pdfjsLib.GlobalWorkerOptions) {
        //pdfjsLib.GlobalWorkerOptions.workerSrc = "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
        pdfjsLib.GlobalWorkerOptions.workerSrc = "./js/pdf.worker.min.js";
      }
    });
  </script>
  <!-- FontAwesome opcional sustituido por SVG-->
  <link rel="stylesheet" href="css/svgicons.css">  
  <!-- Nota: en modo SPA, los <script> insertados por innerHTML no se ejecutan; el módulo se carga desde js/lector.js -->
  <style>
    /* Evita scroll horizontal por offcanvas */
    body { overflow-x: hidden; }
    main { width:100%; max-width: 100%; padding:0;}
  </style>  
</head>
<body class="reader-page light-mode">
  <!-- Navbar del lector (100% Bootstrap nativo, sin CSS global) -->
  <nav class="navbar navbar-dark fixed-top" style="background-color: #2f3a4c;">
    <div class="container-fluid position-relative d-flex align-items-center justify-content-between px-2 px-md-3">
      
      <!-- 1. Logo a la izquierda -->
      <a class="navbar-brand text-truncate" id="volverAObra" href="index.html">
        <img src="favicon32w.webp" alt="Logo de la comunidad JabraScan" class="navbar-brand-logo">
        <span class="brand-text d-none d-sm-inline text-retallat" id="tituloObraPdf">Lector PDF</span>
      </a>

      <!-- 2. Controles centrados en móvil (absolutos al centro) y a la derecha en PC (estáticos) -->
      <div class="navbar-controls" role="toolbar" aria-label="Controles de lectura y tema">
        <div class="btn-group me-1" role="group">
          <button id="readAloud" type="button" class="btn btn-primary btn-sm px-2 py-1" aria-label="Leer página">
            <i class="fa-solid fa-volume-high" aria-hidden="true"></i>
            <span class="label d-none d-sm-inline ms-1">Leer página</span>
          </button>
          <button id="pauseReading" type="button" class="btn btn-outline-primary btn-sm px-2 py-1" style="display:none;" aria-label="Pausar lectura">
            <i class="fa-solid fa-pause" aria-hidden="true"></i>
            <span class="label d-none d-sm-inline">Pausar</span>
          </button>
          <button id="resumeReading" type="button" class="btn btn-outline-primary btn-sm px-2 py-1" style="display:none;" aria-label="Reanudar lectura">
            <i class="fa-solid fa-play" aria-hidden="true"></i>
            <span class="label d-none d-sm-inline">Reanudar</span>
          </button>
          <button id="stopReading" type="button" class="btn btn-outline-danger btn-sm px-2 py-1" style="display:none;" aria-label="Detener lectura">
            <i class="fa-solid fa-stop" aria-hidden="true"></i>
            <span class="label d-none d-sm-inline">Detener</span>
          </button>
        </div>
        <button id="toggleMode" type="button" class="btn btn-outline-secondary btn-sm px-2 py-1" aria-label="Cambiar tema">
          <i class="theme-icon fa-regular fa-moon" aria-hidden="true"></i>
          <span class="label ms-1 d-none d-sm-inline">Modo</span>
        </button>
      </div>

      <!-- 3. Botón menú hamburguesa a la derecha -->
      <button class="navbar-toggler" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasReader" aria-controls="offcanvasReader" aria-label="Abrir menú">
        <span class="navbar-toggler-icon"></span>
      </button>

      <!-- Offcanvas -->
      <div class="offcanvas offcanvas-start text-bg-dark" tabindex="-1" id="offcanvasReader" aria-labelledby="offcanvasReaderLabel">
        <div class="offcanvas-header">
          <h5 class="offcanvas-title" id="offcanvasReaderLabel">Menú lector</h5>
          <button type="button" class="btn-close btn-close-white" data-bs-dismiss="offcanvas" aria-label="Cerrar"></button>
        </div>
        <div class="offcanvas-body d-flex flex-column gap-3">
          <div class="nav flex-column">
            <a class="navbar-brand d-flex align-items-center gap-2" href="index.html" data-target="index.html">
              <i class="fas fa-home me-2"></i> página principal
            </a>
          </div>
        </div>
      </div>

    </div>
  </nav>

  <main class="">
    <!-- Navegación de capítulos (se queda en main) -->
    <div class="row g-2 align-items-center mb-2 mt-2">
      <div class="col-12">
        <div class="input-group cap-input-group flex-wrap flex-md-nowrap justify-content-md-center" role="group" aria-label="Navegación de capítulos">
          <button id="btnPrevCap" type="button" class="btnPrevCap btn btn-brand" aria-label="Capítulo anterior">
            <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i>
            <span class="label">Anterior</span>
          </button>
          <span class="input-group-text d-none d-sm-inline">Capítulo</span>
          <select id="chapterSelect" class="chapterSelect form-select" aria-label="Seleccionar capítulo"></select>
          <button id="btnNextCap" type="button" class="btnNextCap btn btn-brand" aria-label="Capítulo siguiente">
            <i class="fa-solid fa-arrow-right me-1" aria-hidden="true"></i>
            <span class="label">Siguiente</span>
          </button>
        </div>
      </div>
    </div>
    <!--botones navegación cabecera pdf-->
    <div class="pdf-controls d-flex gap-2 align-items-center justify-content-center mt-2 mb-2">
      <button class="prevPage btn btn-outline-secondary" aria-label="Página anterior">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        <span class="label ms-1 d-none d-sm-inline">Página anterior</span>
      </button>
      <span class="pageInfo badge bg-secondary">Página 1</span>
      <button class="nextPage btn btn-outline-secondary" aria-label="Página siguiente">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        <span class="label ms-1 d-none d-sm-inline">Página siguiente</span>
      </button>
    </div>
    <!--contenido pdf-->
    <div id="pdfContainer" class="d-flex flex-column justify-content-center w-100 my-3 my-md-3">
      <canvas id="pdfCanvas"></canvas>
    </div>
      <!--botones navegación pie pdf-->
    <div class="pdf-controls d-flex gap-2 align-items-center justify-content-center mt-2 mb-2">
      <button class="prevPage btn btn-outline-secondary" aria-label="Página anterior">
        <i class="fa-solid fa-chevron-left" aria-hidden="true"></i>
        <span class="label ms-1 d-none d-sm-inline">Página anterior</span>
      </button>
      <span class="pageInfo badge bg-secondary">Página 1</span>
      <button class="nextPage btn btn-outline-secondary" aria-label="Página siguiente">
        <i class="fa-solid fa-chevron-right" aria-hidden="true"></i>
        <span class="label ms-1 d-none d-sm-inline">Página siguiente</span>
      </button>
    </div>
    <!-- navegació por capitulos pie -->
    <div class="row g-2 align-items-center mb-2 mt-2">
      <div class="col-12">
        <div class="input-group cap-input-group flex-wrap flex-md-nowrap justify-content-md-center" role="group" aria-label="Navegación de capítulos">
          <button id="btnPrevCapDown" type="button" class="btnPrevCap btn btn-brand" aria-label="Capítulo anterior">
            <i class="fa-solid fa-arrow-left me-1" aria-hidden="true"></i>
            <span class="label">Anterior</span>
          </button>
          <button id="btnNextCapDown" type="button" class="btnNextCap btn btn-brand" aria-label="Capítulo siguiente">
            <i class="fa-solid fa-arrow-right me-1" aria-hidden="true"></i>
            <span class="label">Siguiente</span>
          </button>
        </div>
      </div>
    </div>
    <div class="optionaldata mt-3"></div>
  </main>

  <!-- En modo SPA no se ejecuta este módulo; se usa js/lector.js -->
  <script type="module" src="js/lector.js"></script>
  <!-- Bootstrap JS -->
  <script src="./js/bootstrap.bundle.min.js"></script>
</body>
</html>
