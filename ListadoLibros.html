<!doctype html><html lang=es><meta charset=UTF-8><title>Contador de PDFs</title><body><h1>Contador de PDFs por Carpeta</h1><label for=folderSelect>Selecciona una carpeta:</label><select id=folderSelect><option value>-- Selecciona --</select><p id=pdfCount>Número de PDFs:</p><script>const fs=require(`fs`),path=require(`path`),booksDir=path.join(__dirname,`books`),excluir=new Set([`css`,`img`,`js`]),booksData={};
// Guardar el resultado en 'books.json'
fs.readdirSync(booksDir).forEach(folder=>{let folderPath=path.join(booksDir,folder);fs.statSync(folderPath).isDirectory()&&!excluir.has(folder)&&(booksData[folder]=fs.readdirSync(folderPath).filter(file=>file.toLowerCase().endsWith(`.pdf`)))}),fs.writeFileSync(path.join(__dirname,`books.json`),JSON.stringify(booksData,null,2),`utf-8`);</script><script>const folderSelect=document.getElementById(`folderSelect`),pdfCount=document.getElementById(`pdfCount`);
// Cargar el JSON desde GitHub Pages
fetch(`https://jabrascan.github.io/books.json`).then(response=>response.json()).then(data=>{
// Evento al seleccionar carpeta
Object.keys(data).forEach(folder=>{let option=document.createElement(`option`);option.value=folder,option.textContent=folder,folderSelect.appendChild(option)}),folderSelect.addEventListener(`change`,()=>{pdfCount.textContent=`Número de PDFs: ${(data[folderSelect.value]||[]).filter(file=>file.toLowerCase().endsWith(`.pdf`)).length}`})}).catch(error=>{console.error(`Error al cargar el JSON:`,error),pdfCount.textContent=`No se pudo cargar el archivo.`});</script>
