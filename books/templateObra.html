<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{titlePrincipal}} - {{author}}</title>

  <meta name="description" content="{{description}}">

  <link rel="canonical" href="{{url}}">

  <!-- Open Graph -->
  <meta property="og:type" content="book">
  <meta property="og:title" content="{{titlePrincipal}}">
  <meta property="og:description" content="{{description}}">
  <meta property="og:image" content="{{image}}">
  <meta property="og:url" content="{{url}}">
  <meta property="og:locale" content="es_ES">

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{titlePrincipal}}">
  <meta name="twitter:description" content="{{description}}">
  <meta name="twitter:image" content="{{image}}">

  <meta name="theme-color" content="#1a1a1a">

  <!-- Datos estructurados -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "Book",
    "name": "{{titlePrincipal}}",
    "author": {
        "@type": "Person",
        "name": "{{author}}"
    },
    "translator": {
        "@type": "Person",
        "name": "{{traductor}}"
    },
    "description": "{{description}}",
    "image": "{{image}}",
    "url": "{{url}}",
    "alternateName": "{{titlesAlternativos}}",
    "inLanguage": "es",
    "genre": "{{tipoobra}} {{ubicacion}}",
    "keywords": "{{categoria}}",
    "datePublished": "{{fechaCreacion}}"
  }
  </script>
  <style>
    :root {
      --bg: #fafafa;
      --card: #ffffff;
      --text: #222;
      --muted: #555;
      --border: #e0e0e0;
      --accent: #0066cc;
    }
    
    * { box-sizing: border-box; }
    
    body {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      margin: 0;
      padding: 0;
      background: var(--bg);
      color: var(--text);
      line-height: 1.55;
    }
    
    main {
      max-width: 900px;
      margin: 0 auto;
      padding: 16px;
      background: var(--card);
    }
    
    h1 {
      font-size: 1.75rem;
      margin: 0 0 16px;
      line-height: 1.25;
    }
    
    h2 {
      font-size: 1.3rem;
      margin: 28px 0 12px;
      padding-bottom: 6px;
      border-bottom: 1px solid var(--border);
    }
    
    .info {
      display: flex;
      gap: 20px;
      margin-bottom: 8px;
    }
    
    .portada {
      width: 220px;
      max-width: 100%;
      height: auto;
      border-radius: 8px;
      display: block;
      flex-shrink: 0;
    }
    
    .meta p {
      margin: 5px 0;
      color: var(--muted);
      font-size: 0.95rem;
    }
    
    .meta strong { color: var(--text); }
    
    .alternativos p {
      margin: 2px 0 2px 12px;
      color: #666;
      font-size: 0.9rem;
    }
    
    .sinopsis p {
      margin: 0;
      font-size: 1.05rem;
    }
    
    .acciones {
      margin: 20px 0;
    }
    
    .acciones a {
      display: inline-block;
      margin-right: 16px;
      color: var(--accent);
      text-decoration: none;
      font-weight: 500;
    }
    
    .acciones a:hover {
      text-decoration: underline;
    }
    
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
      gap: 10px;
      margin-top: 12px;
    }
    
    .galeria img {
      width: 100%;
      height: auto;
      border-radius: 6px;
      border: 1px solid var(--border);
      aspect-ratio: 2/3;
      object-fit: cover;
      background: #eee;
    }
    
    /* Mobile */
    @media (max-width: 640px) {
      main { padding: 12px; }
      h1 { font-size: 1.45rem; }
      .info { flex-direction: column; align-items: center; text-align: center; }
      .portada { width: 180px; }
      .galeria { grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); }
    }
  </style>
</head>
<body>
  <main>
    <article>
      <header>
        <h1>{{titlePrincipal}}</h1>
        <div class="info">
          <img 
            class="portada" 
            src="{{image}}" 
            alt="Portada de {{titlePrincipal}} - {{author}}"
            width="220"
            height="330"
            loading="eager"
            decoding="async"
          >

          <div class="meta">
            <p><strong>Autor:</strong> {{author}}</p>
            <p><strong>Género:</strong> {{tipoobra}}</p>
            <p><strong>Categoría:</strong> {{categoria}}</p>
            <p><strong>Fecha de creación:</strong> {{fechaCreacion}}</p>
            <p><strong>Traductor:</strong> {{traductor}}</p>
            <p><strong>Otros Títulos:</strong></p>
            <div class="alternativos">
              {{titlesAlternativos}}
            </div>
          </div>
        </div>
      </header>

      <section class="sinopsis">
        <h2>Sinopsis</h2>
        <p>{{description}}</p>
      </section>

      <div class="acciones">
        <a href="/#{{clave}}">📖 Leer Capítulos</a>
        {{wiki}}
      </div>
      <!-- Bloque de aprobación y discord -->
      {{aprobacion}}

      <section>
        <h2>Galería</h2>
        <div class="galeria">
          {{galeria}}
        </div>
      </section>
  </main>
</body>
</html>
