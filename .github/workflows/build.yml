name: Generar sitio completo (index + obras + sitemap)

on:
  push:
    branches: [ main ]   # Se ejecuta al hacer push en la rama main
  workflow_dispatch:     # Permite lanzarlo manualmente desde la interfaz de GitHub

permissions:
  contents: write        # 🔑 Permite al workflow hacer commit y push de cambios

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1️⃣ Checkout del repositorio con historial completo
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # Necesario para poder hacer pull/rebase

      # 2️⃣ Configurar Node.js
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      # 3️⃣ Instalar dependencias necesarias (Node)
      - name: Instalar dependencias Node
        run: npm install fast-xml-parser --no-save

      # 4️⃣ Bloque A: Generar JSON-LD e insertarlo en index.html
      #- name: Generar JSON-LD en index.html
      #  run: node scripts/xmlToJsonLd.js

      # 5️⃣ Bloque B: Generar HTML de obras y sitemap
      - name: Generar HTML de obras y sitemap
        run: node scripts/buildPages.js

      # --------------------------
      # 6️⃣ Set up Python, instalar dependencias Python y ejecutar el script de imágenes
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Instalar dependencias Python
        run: python -m pip install --upgrade pip Pillow

      - name: Ejecutar generador de imágenes responsivas
        run: python scripts/generate_responsive_images.py -d .

      # 7️⃣ Commit y push de todos los cambios generados
      - name: Commit y push cambios
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Añadir todos los posibles cambios generados por los pasos anteriores (index, obras, sitemap, imágenes)
          git add -A
          git diff --cached --quiet || git commit -m "Build: actualizar index y obras y/o imágenes generadas"
          git pull origin main --rebase   # 🔑 Trae cambios remotos antes de empujar
          git push
