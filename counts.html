<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Ranking de Obras</title>

    <link rel="stylesheet" href="css/variables.css">
    <link rel="stylesheet" href="css/utilities.css">

</head>

<body>

    <div>
        <h1>🏆 Ranking de Obras</h1>
    </div>

    <main>
        <div id="loader" class="loader">
            Cargando datos...
        </div>

        <section id="top-periodos" class="container-fluid px-0 mb-4">
            <div class="row g-3">
                <div class="col-12 col-md-6">
                    <div id="top-diario" class="card h-100">
                        <div class="card-body">
                            <h2 class="card-title h5 mb-3">TOP DIARIO</h2>
                            <div data-role="lista">Cargando...</div>
                        </div>
                    </div>
                </div>

                <div class="col-12 col-md-6">
                    <div id="top-mensual" class="card h-100">
                        <div class="card-body">
                            <h2 class="card-title h5 mb-3">TOP MENSUAL</h2>
                            <div data-role="lista">Cargando...</div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <section id="podio" class="podium-container"></section>

        <section id="ranking" class="ranking-container"></section>

        <div id="error" class="hidden"></div>

    </main>

    <footer></footer>
</body>
